<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/logo-icon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Plásticos Superior San Judas S.A.S.</title>
    <script>
      // Aplica la clase `dark` antes de que cargue el bundle de React, para
      // evitar el flash de modo claro en cada carga (mismo criterio de
      // lectura que ThemeContext.tsx). La preferencia se guarda POR
      // USUARIO (ps_theme:<id>, o ps_theme:anon antes de loguearse) — para
      // saber cuál leer acá hay que fijarse quién es el usuario logueado
      // ahora mismo, igual que AuthContext.tsx.
      (function () {
        try {
          var rawUser = localStorage.getItem("user");
          var userId = rawUser ? JSON.parse(rawUser).id : "anon";
          var pref = localStorage.getItem("ps_theme:" + userId);
          var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
